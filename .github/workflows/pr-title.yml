name: PR title

# Separate from CI so that editing a title re-checks it without rerunning the whole suite.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  # A merge queue needs every required check on its merge-group commit; the title was
  # already checked on the PR, so that path only reports success.
  merge_group:

permissions:
  contents: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: pr-title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    steps:
      - name: Check Conventional Commits format
        if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge group (title checked on the PR)
        if: github.event_name == 'merge_group'
        run: echo "PR titles were checked before queueing."
